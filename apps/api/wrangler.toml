name = "openclaw-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
SLICE_SIZE = "25" # Pages per slice

# R2 bucket binding (for optional caching)
[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "openclaw-documents"

# Note: Cloudflare Queue can be added later for batch processing
# For now, use the direct /api/v1/discover endpoint

# Secrets (set via wrangler secret put)
# DATABASE_URL - Neon PostgreSQL connection string

[env.production]
vars = { ENVIRONMENT = "production", SLICE_SIZE = "25" }
